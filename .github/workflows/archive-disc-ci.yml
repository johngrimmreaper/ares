name: Archive Disc CI

on:
  push:
    branches:
      - development/archive-disc-containers
  pull_request:
    branches:
      - development/archive-disc-containers
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-build:
    name: Ubuntu 24.04 source build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x86-64
            minimum-cpu: OFF
            optional-targets: ON
            run-tests: true
          - variant: x86-64-v2
            minimum-cpu: ON
            optional-targets: OFF
            run-tests: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Add ares dependency PPA
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:johngrimmreaper/24.04
          sudo apt-get update

      - name: Install source build and fixture dependencies
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends devscripts equivs ninja-build p7zip-full python3
          sudo mk-build-deps \
            --install \
            --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Configure directly from the source tree
        shell: bash
        run: |
          cmake -S . -B "build/${{ matrix.variant }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DARES_BUILD_LOCAL=OFF \
            -DARES_ENABLE_MINIMUM_CPU=${{ matrix.minimum-cpu }} \
            -DARES_SKIP_DEPS=ON \
            -DARES_BUILD_OPTIONAL_TARGETS=${{ matrix.optional-targets }} \
            -DARES_CORES=md \
            -DWITH_SYSTEM_LIBCHDR=ON

      - name: Build Ares
        shell: bash
        run: cmake --build "build/${{ matrix.variant }}" --parallel "$(nproc)"

      - name: Generate legal synthetic SevenZip fixtures
        if: matrix.run-tests
        shell: bash
        run: tests/archive-disc/generate-fixtures.sh test-fixtures

      - name: Run archive-disc integration matrix
        if: matrix.run-tests
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.variant }}"
          "build/${{ matrix.variant }}/tests/archive-disc/archive-disc-test" test-fixtures \
            | tee "artifacts/${{ matrix.variant }}/archive-disc-test.log"
          tar -cJf "artifacts/${{ matrix.variant }}/synthetic-sevenzip-fixtures.tar.xz" \
            -C test-fixtures .

      - name: Inspect executable linkage
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.variant }}"
          binary=$(find "build/${{ matrix.variant }}" -type f -name ares -perm -111 -print -quit)
          if [ -z "$binary" ]; then
            echo 'The Ares executable was not produced.' >&2
            exit 1
          fi
          ldd "$binary" | tee "artifacts/${{ matrix.variant }}/ldd.txt"
          grep -F 'libchdr.so' "artifacts/${{ matrix.variant }}/ldd.txt"
          cp "$binary" "artifacts/${{ matrix.variant }}/ares"
          sha256sum "artifacts/${{ matrix.variant }}/ares" \
            > "artifacts/${{ matrix.variant }}/SHA256SUMS"

      - name: Upload inspected build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-disc-ubuntu-24.04-${{ matrix.variant }}
          path: artifacts/${{ matrix.variant }}
          if-no-files-found: warn
