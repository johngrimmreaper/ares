name: Archive Disc Core Smoke

on:
  push:
    branches:
      - feature/archive-disc-sevenzip
    paths:
      - '.github/workflows/archive-disc-core-smoke.yml'
      - 'nall/**'
      - 'thirdparty/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-sector-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build and archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y cmake ccache ninja-build libsdl2-dev libgtk-3-dev qt6-base-dev
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full

      - name: Build SDL3
        shell: bash
        run: .github/scripts/build_sdl.sh

      - name: Inject core archive smoke target
        shell: bash
        run: |
          set -euo pipefail
          cat > nall/nall/archive-disc-core-smoke.cpp <<'CPP'
          #include <nall/nall.hpp>
          #include <nall/decode/disc-archive.hpp>
          #include <cstdio>

          using namespace nall;

          auto main(int argc, char** argv) -> int {
            if(argc != 2) {
              std::fprintf(stderr, "usage: archive-disc-core-smoke <disc-container>\n");
              return 64;
            }

            Decode::DiscArchive source;
            if(!source.open(argv[1])) {
              std::fprintf(stderr, "failed to resolve archived disc: %s\n", argv[1]);
              return 1;
            }

            auto sector = source.readDataSector(0);
            if(sector.size() != 2048) {
              std::fprintf(stderr, "unexpected sector size: %zu\n", sector.size());
              return 2;
            }
            if(memory::compare(sector.data(), "SEGA", 4)) {
              std::fprintf(stderr, "sector 0 does not contain SEGA signature\n");
              return 3;
            }

            std::printf("archive sector smoke: PASS: %s\n", argv[1]);
            return 0;
          }
          CPP

          cat >> nall/nall/CMakeLists.txt <<'CMAKE'

          # Development-only target injected by archive-disc-core-smoke.yml.
          add_executable(archive-disc-core-smoke archive-disc-core-smoke.cpp)
          target_link_libraries(archive-disc-core-smoke PRIVATE ares::nall)
          CMAKE

      - name: Build core archive smoke executable
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ubuntu-ci
          cmake --build build --target archive-disc-core-smoke

      - name: Create archive fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ares-archive-disc-core-smoke
          mkdir -p /tmp/ares-archive-disc-core-smoke/disc

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('/tmp/ares-archive-disc-core-smoke')
          disc = root / 'disc'
          (disc / 'game.cue').write_text(
              'FILE "track.bin" BINARY\n'
              '  TRACK 01 MODE1/2352\n'
              '    INDEX 01 00:00:00\n',
              encoding='ascii',
          )

          sector = bytearray(2352)
          sector[16:20] = b'SEGA'
          (disc / 'track.bin').write_bytes(sector)

          with zipfile.ZipFile(root / 'mega-cd.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(disc / 'game.cue', 'disc/game.cue')
              zf.write(disc / 'track.bin', 'disc/track.bin')
          PY

          cd /tmp/ares-archive-disc-core-smoke
          if command -v 7zz >/dev/null 2>&1; then
            sevenzip=7zz
          elif command -v 7z >/dev/null 2>&1; then
            sevenzip=7z
          else
            echo 'No 7-Zip command found after package installation' >&2
            exit 1
          fi

          "$sevenzip" a -bd -y -t7z -ms=on  mega-cd-solid.7z    disc >/dev/null
          "$sevenzip" a -bd -y -t7z -ms=off mega-cd-nonsolid.7z disc >/dev/null

      - name: Read sector zero from archive containers
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(find build -type f -name archive-disc-core-smoke -perm -111 -print -quit)"
          test -n "$smoke"

          "$smoke" /tmp/ares-archive-disc-core-smoke/mega-cd.zip
          "$smoke" /tmp/ares-archive-disc-core-smoke/mega-cd-solid.7z
          "$smoke" /tmp/ares-archive-disc-core-smoke/mega-cd-nonsolid.7z
